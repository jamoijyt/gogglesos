# Goggles OS: compressed swap in RAM (zram). Big VR games such as Bonelab can use more than
# 16 GB under Proton; compressing pages that haven't been used for a while gives them room
# without the PC grinding to a halt on disk swap.
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
