# Goggles OS: when memory is about to run out, close the biggest program (in practice, the
# game) instead of letting the whole PC freeze. Never the desktop, the sound or the VR runtime.
#   -m 4 -s 10   act when under 4% of RAM and under 10% of swap is left
#   -r 3600      write a memory report to the log once an hour
#   -n           show a desktop notification when something is closed
#   ($$ is a plain $ in systemd unit files)
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -m 4 -s 10 -r 3600 -n --avoid "^(kwin_wayland|kwin_x11|plasmashell|Xwayland|Xorg|sddm|systemd|systemd-.*|pipewire|pipewire-pulse|wireplumber|dbus-daemon|dbus-broker|wivrn-server|monado-service|gogglesxr)$$"
