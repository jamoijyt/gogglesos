# Goggles OS gaming / VR tuning
# Many games (and Proton) need a large number of memory mappings (same as SteamOS)
vm.max_map_count = 2147483642
# Don't throttle games that trigger split-lock detection (SteamOS default)
kernel.split_lock_mitigate = 0
# Swap goes to compressed RAM first (zram, /etc/systemd/zram-generator.conf), which is far faster
# than disk, so let the kernel use it for memory that sits idle instead of squeezing the game
vm.swappiness = 100
