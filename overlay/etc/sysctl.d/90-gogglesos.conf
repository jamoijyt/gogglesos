# Goggles OS gaming / VR tuning
# Many games (and Proton) need a large number of memory mappings (same as SteamOS)
vm.max_map_count = 2147483642
# Don't throttle games that trigger split-lock detection (SteamOS default)
kernel.split_lock_mitigate = 0
# Prefer keeping game data in RAM over swapping
vm.swappiness = 10
