---
# Goggles OS: Glass / Lite appearance choice.
# The chosen id is stored as "packagechooser_appearance" and applied by
# contextualprocess_appearance.conf after the system is installed.
mode: required
method: legacy
labels:
    step: "Appearance"
    step[de]: "Erscheinungsbild"
    step[es]: "Apariencia"
    step[fr]: "Apparence"
default: glass
items:
    - id: glass
      name: "Glass (recommended)"
      description: "Frosted-glass blur, translucent windows and panels, rounded corners and smooth animations. Best on a dedicated GPU like the ones PC VR needs."
      screenshot: "/usr/share/gogglesos/appearance-glass.png"
    - id: lite
      name: "Lite"
      description: "Solid, opaque windows with no blur or translucency, and quicker animations. Keeps the dark theme and rounded corners. Uses fewer GPU resources, leaving more headroom for VR."
      screenshot: "/usr/share/gogglesos/appearance-lite.png"
